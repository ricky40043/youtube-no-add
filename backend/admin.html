<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube 後台 · 資料表瀏覽</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Microsoft JhengHei",sans-serif; background:#0f172a; color:#e2e8f0; }
  .login { max-width:340px; margin:14vh auto; background:#1e293b; padding:2rem; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.4); text-align:center; }
  .login h1 { font-size:1.25rem; margin:0 0 1rem; }
  input { width:100%; padding:.75rem; border:2px solid #334155; border-radius:10px; font-size:1rem; background:#0f172a; color:#e2e8f0; }
  button { background:#ef4444; color:#fff; border:0; padding:.6rem 1.1rem; border-radius:10px; font-weight:700; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .err { color:#f87171; font-size:.85rem; margin-top:.6rem; }

  .layout { display:flex; min-height:100vh; }
  .side { width:240px; flex:0 0 240px; background:#1e293b; border-right:1px solid #334155; padding:1rem .75rem; overflow-y:auto; max-height:100vh; position:sticky; top:0; }
  .side h2 { font-size:.95rem; margin:.2rem .25rem 1rem; display:flex; align-items:center; gap:.4rem; }
  .tbl-item { display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding:.5rem .6rem; border-radius:8px; cursor:pointer; font-size:.85rem; }
  .tbl-item:hover { background:#334155; }
  .tbl-item.active { background:#ef4444; color:#fff; }
  .tbl-item .cnt { background:rgba(148,163,184,.25); border-radius:20px; padding:.05rem .5rem; font-size:.72rem; font-weight:700; }
  .tbl-item.active .cnt { background:rgba(255,255,255,.25); }

  .main { flex:1; padding:1.2rem 1.4rem 4rem; overflow-x:auto; min-width:0; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:.6rem; }
  .topbar h1 { font-size:1.1rem; margin:0; }
  .logout { background:#475569; padding:.4rem .9rem; font-size:.82rem; }
  .meta { color:#94a3b8; font-size:.82rem; margin-bottom:.8rem; }
  .pager { display:flex; align-items:center; gap:.6rem; margin:.4rem 0 1rem; font-size:.82rem; color:#94a3b8; }
  .pager button { background:#334155; padding:.35rem .8rem; }
  .pager button:disabled { opacity:.4; cursor:default; }

  .tbox { background:#1e293b; border-radius:12px; overflow:auto; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  table { border-collapse:collapse; font-size:.8rem; width:100%; }
  th,td { text-align:left; padding:.5rem .65rem; border-bottom:1px solid #334155; white-space:nowrap; max-width:360px; overflow:hidden; text-overflow:ellipsis; }
  th { color:#fca5a5; position:sticky; top:0; background:#172033; font-weight:700; }
  th .ty { color:#64748b; font-weight:400; font-size:.72rem; }
  td { vertical-align:top; }
  td.null { color:#64748b; font-style:italic; }
  tbody tr:hover { background:#243449; }
  .empty { color:#94a3b8; text-align:center; padding:2rem; }
  .hint { color:#64748b; font-size:.85rem; padding:2rem; text-align:center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const TKEY = 'ytAdminToken';
let token = localStorage.getItem(TKEY) || '';
let tables = [];
let current = null;       // {name}
let offset = 0;
const LIMIT = 50;
const root = document.getElementById('root');
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path){
  const r = await fetch('/api/admin'+path, { headers:{ 'X-Admin-Token': token } });
  if(!r.ok){ const e=new Error('http'); e.status=r.status; throw e; }
  return r.json();
}

function loginView(msg){
  root.innerHTML = `<div class="login"><h1>📺 YouTube 後台</h1>
    <input id="tok" type="password" placeholder="管理 Token">
    <div style="height:.6rem"></div>
    <button onclick="doLogin()">進入</button>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}</div>`;
  document.getElementById('tok').addEventListener('keyup',e=>{if(e.key==='Enter')doLogin();});
}
async function doLogin(){
  token = document.getElementById('tok').value.trim();
  try{ await api('/tables'); localStorage.setItem(TKEY, token); boot(); }
  catch(e){ loginView(e.status===401?'Token 錯誤':'連線失敗'); }
}
function logout(){ localStorage.removeItem(TKEY); token=''; current=null; loginView(); }

function shell(){
  root.innerHTML = `<div class="layout">
    <aside class="side">
      <h2>🗄 資料表</h2>
      <div id="tlist"></div>
    </aside>
    <main class="main">
      <div class="topbar"><h1 id="title">資料表瀏覽</h1><button class="logout" onclick="logout()">登出</button></div>
      <div id="content"><p class="hint">← 從左側選一張資料表</p></div>
    </main>
  </div>`;
  renderList();
}
function renderList(){
  document.getElementById('tlist').innerHTML = tables.map(t=>`
    <div class="tbl-item ${current&&current===t.name?'active':''}" onclick="openTable('${esc(t.name)}')">
      <span>${esc(t.name)}</span>
      <span class="cnt">${t.count==null?'?':t.count}</span>
    </div>`).join('') || '<p class="hint">沒有資料表</p>';
}

async function openTable(name){
  current = name; offset = 0; renderList();
  document.getElementById('title').textContent = name;
  await loadPage();
}
async function loadPage(){
  const content = document.getElementById('content');
  content.innerHTML = '<p class="hint">載入中…</p>';
  try{
    const d = await api(`/table/${encodeURIComponent(current)}?limit=${LIMIT}&offset=${offset}`);
    const from = d.total? offset+1 : 0;
    const to = Math.min(offset+d.rows.length, d.total);
    const head = d.columns.map(c=>`<th>${esc(c.name)}<br><span class="ty">${esc(c.type)}</span></th>`).join('');
    const body = d.rows.map(r=>`<tr>${d.columns.map(c=>{
      const v = r[c.name];
      if(v===null||v===undefined) return '<td class="null">NULL</td>';
      const s = String(v);
      return `<td title="${esc(s)}">${esc(s.length>200?s.slice(0,200)+'…':s)}</td>`;
    }).join('')}</tr>`).join('');
    content.innerHTML = `
      <div class="meta">共 <b>${d.total}</b> 筆 · 欄位 ${d.columns.length} 個 · 顯示 ${from}–${to}</div>
      <div class="pager">
        <button onclick="prevPage()" ${offset<=0?'disabled':''}>← 上一頁</button>
        <span>第 ${Math.floor(offset/LIMIT)+1} 頁 / 共 ${Math.max(1,Math.ceil(d.total/LIMIT))} 頁</span>
        <button onclick="nextPage()" ${offset+LIMIT>=d.total?'disabled':''}>下一頁 →</button>
      </div>
      <div class="tbox"><table>
        <thead><tr>${head}</tr></thead>
        <tbody>${body || `<tr><td class="empty" colspan="${d.columns.length||1}">這張表沒有資料</td></tr>`}</tbody>
      </table></div>`;
  }catch(e){
    if(e.status===401){ logout(); return; }
    content.innerHTML = '<p class="err">載入失敗</p>';
  }
}
function prevPage(){ if(offset>0){ offset=Math.max(0,offset-LIMIT); loadPage(); } }
function nextPage(){ offset+=LIMIT; loadPage(); }

async function boot(){
  try{
    const d = await api('/tables');
    tables = d.tables;
    shell();
  }catch(e){ if(e.status===401){ logout(); } else { loginView('連線失敗'); } }
}

if(token) boot(); else loginView();
</script>
</body>
</html>
